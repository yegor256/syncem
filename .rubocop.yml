---
AllCops:
  DisplayCopNames: true
  TargetRubyVersion: 2.3
  SuggestExtensions: false
  NewCops: enable
plugins:
  - rubocop-rake
  - rubocop-minitest
  - rubocop-performance
  - rubocop-elegant
Minitest/EmptyLineBeforeAssertionMethods:
  Enabled: false
Layout/EndOfLine:
  EnforcedStyle: lf
Metrics/MethodLength:
  Max: 50
Layout/ParameterAlignment:
  Enabled: false
Style/OptionalBooleanParameter:
  Enabled: false
Metrics/CyclomaticComplexity:
  Max: 10
Metrics/PerceivedComplexity:
  Max: 10
Metrics/AbcSize:
  Max: 25
Elegant/ClassInModule:
  Exclude:
    - 'lib/**/*'
    - '**/test_*.rb'
    - '**/*Test.rb'
Elegant/GoodMethodName:
  AllowedNames:
    - 'method_missing'
    - 'respond_to?'
    - 'respond_to_missing?'
Elegant/NoRedundantVariable:
  Exclude:
    - 'test/**/*'
Style/Send:
  Exclude:
    - 'test/**/*'
require: []
